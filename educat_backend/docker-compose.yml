version: "3.9"

# EduCat AI — Local Development Stack
# Usage: docker-compose up -d
# API:   http://localhost:8000/docs
# Flower: http://localhost:5555

services:

  # ── FastAPI Backend ─────────────────────────────────────────────
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - educat_net

  # ── Celery Worker ────────────────────────────────────────────────
  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery_app worker
             --loglevel=info --concurrency=4 -Q celery,embeddings,reports
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - educat_net

  # ── Celery Beat (Scheduler) ──────────────────────────────────────
  beat:
    build: .
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - educat_net

  # ── Celery Flower (Task Monitor) ─────────────────────────────────
  flower:
    build: .
    command: celery -A app.tasks.celery_app.celery_app flower
             --port=5555 --broker=redis://redis:6379/1
    ports:
      - "5555:5555"
    env_file: .env
    depends_on:
      - redis
      - worker
    networks:
      - educat_net

  # ── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - educat_net

  # ── Redis Insight (Dev UI) ───────────────────────────────────────
  redis-insight:
    image: redislabs/redisinsight:latest
    ports:
      - "8001:8001"
    depends_on:
      - redis
    networks:
      - educat_net

volumes:
  redis_data:

networks:
  educat_net:
    driver: bridge
